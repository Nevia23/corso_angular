<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image"></div>
    <mat-card-title>{{ cani[0].nome }}</mat-card-title>
    <mat-card-subtitle>{{ cani[0].razza }}</mat-card-subtitle>
  </mat-card-header>
  <img
    mat-card-image
    src="https://material.angular.dev/assets/img/examples/shiba2.jpg"
    alt="Photo of a Shiba Inu"
  />
  <mat-card-content>
    <p>
      <!-- es. di data binding, ovvero passaggio di dati dal componente all'html -->
      {{ cani[0].descrizione }}
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button matButton>LIKE</button>
    <button matButton>SHARE</button>
    <!-- Use property binding to dynamically set values for properties and attributes. -->
    <button mat.raised-button color="primary" [disabled]="isDisabled" (click)="hoCliccato('Sono felice')">Test</button>
 </mat-card-actions>
   </mat-card>
  <mat-form-field class="example-full-width">
  <mat-label>Input</mat-label>
  <input matInput placeholder="Placeholder" (input)="onInput($event)">
  </mat-form-field>

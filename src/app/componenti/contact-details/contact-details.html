<mat-card appearance="outlined">
  <mat-card-header> Profilo di {{ persona()?.nome }} {{ persona()?.cognome }} </mat-card-header>
  <mat-card-content>
    <div class="form-container">
      <form [formGroup]="updateForm" (ngSubmit)="onSubmit()">
        <mat-form-field class="form-col">
          <mat-label>Nome</mat-label>
          <input matInput type="text" placeholder="Nome" name="nome" formControlName="nome" />
        </mat-form-field>
        <mat-form-field class="form-col">
          <mat-label>Cognome</mat-label>
          <input
            matInput
            type="text"
            placeholder="Cognome"
            name="cognome"
            formControlName="cognome"
          />
        </mat-form-field>
        <mat-form-field class="form-col">
          <mat-label>Email</mat-label>
          <input matInput type="email" placeholder="Email" name="email" formControlName="email" />
        </mat-form-field>

        <mat-form-field class="form-col">
          <mat-label> Colore</mat-label>
          <mat-select name="colore" formControlName="colore">
            <mat-option value="red">Rosso</mat-option>
            <mat-option value="green">Verde</mat-option>
            <mat-option value="blue">Blu</mat-option>
            <mat-option value="black">Nero</mat-option>
            <mat-option value="orange">Arancione</mat-option>
            <mat-option value="purple">Viola</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="button-group">
          <button mat-raised-button color="primary" type="button" (click)="onAnnul()">Annulla</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="!updateForm.valid">Aggiorna</button>
          <button mat-raised-button style="background-color: tomato;" type="button" (click)="onDelete()">Elimina</button>
        </div>
      </form>
    </div>
  </mat-card-content>
</mat-card>
